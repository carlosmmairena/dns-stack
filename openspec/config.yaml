schema: spec-driven

# Project context
context: |
  Stack de DNS para securizar la resolución DNS de dispositivos dentro de una LAN.
  Flujo: device --> [Pi-hole] --> [DNSCrypt-Proxy] --> Quad9 / CleanBrowsing Security (DNS encriptado, failover automático) --> internet.

  Idioma: artefactos y commits (conventional commits) en español | código en inglés

  Componentes (docker-compose.yml):
    - pihole (pihole/pihole:latest): filtra publicidad/malware y valida DNSSEC
      (FTLCONF_dns_dnssec=true), expone 53/tcp+udp para consultas LAN y panel
      web en 8080. IP fija 172.20.0.3 en la red pihole_net. Reenvía todo a
      dnscrypt-proxy vía FTLCONF_dns_upstreams=172.20.0.2#5053.
    - dnscrypt-proxy (build local, dnscrypt-proxy 2.1.18): resolver upstream
      encriptado hacia dos proveedores independientes
      (server_names=quad9-dnscrypt-ip4-filter-pri,cleanbrowsing-security),
      con balanceo/failover automático nativo (lb_strategy, default wp2).
      require_dnssec=true, require_nolog=true — inertes con server_names
      explícito, cada proveedor fue vetted manualmente contra fuente primaria
      (ver openspec/changes/add-upstream-dns-redundancy). Escucha en
      172.20.0.2:5053, no expuesto fuera de la red interna pihole_net.
    - Red Docker bridge dedicada pihole_net (172.20.0.0/24) con IPs estáticas
      para ambos contenedores.

  Convenciones:
    - Target de despliegue: host tipo Raspberry Pi dentro de la LAN
      (docker-compose.yml usa CPU_ARCH build arg, arm64 por defecto).
    - Secretos (ej. PIHOLE_PASSWORD) siempre vía .env, nunca hardcodeados
      (ver .env.example como plantilla).
    - Persistencia de Pi-hole vía bind mounts (etc-pihole/, etc-dnsmasq.d/),
      generados automáticamente al levantar el stack — no se versionan.
    - FTLCONF_webserver_acl debe ajustarse a la subnet real de la LAN del
      usuario; el valor en el compose es un ejemplo, no un default seguro.

  Pendiente crítico fuera del compose: regla de firewall/DNAT que fuerce a
  todos los dispositivos de la LAN a resolver únicamente vía Pi-hole,
  bloqueando DNS de salida hacia otros resolvers (ej. 8.8.8.8, 1.1.1.1).
  Sin esa regla, el hardening de la cadena Pi-hole -> DNSCrypt-Proxy -> upstream
  es sólido pero evadible por cualquier dispositivo que configure su propio
  DNS — es el punto más importante de todo el stack.

  Cadena de confianza por hop:
    - LAN -> Pi-hole: DNS en claro, se asume LAN confiable. No hay
      autenticación de cliente.
    - Pi-hole -> dnscrypt-proxy: en claro pero aislado en red docker interna
      (pihole_net), sin puerto publicado — no es superficie de ataque externa.
    - dnscrypt-proxy -> upstream (Quad9 / CleanBrowsing Security): DNSCrypt
      cifrado y autenticado con ambos. La validación DNSSEC real la hace cada
      proveedor (require_dnssec en dnscrypt-proxy no filtra nada cuando
      server_names es explícito, no valida localmente); se confía en el AD
      flag porque el canal es autenticado. Ambos proveedores fueron vetted
      manualmente (DNSSEC + no-log confirmados contra su documentación
      técnica/política de privacidad, no solo el catálogo público).

  Vectores de bypass a considerar (más allá del DNS en puerto 53):
    - IPv6: SLAAC/RA (RDNSS) o DHCPv6 pueden entregarle a un dispositivo un
      DNS IPv6 directo del router, evadiendo Pi-hole sin tocar el puerto 53
      IPv4. El firewall/DNAT debe cubrir ambas familias o IPv6 debe
      inhabilitarse explícitamente en la LAN.
    - DoH/DoT hardcodeado: apps con resolver fijo por HTTPS/853 ignoran el
      DNS del sistema; el DNAT de puerto 53 no lo detiene.

# Per-artifact rules
rules:
  proposal:
    - Indicar explícitamente el impacto en la cadena de confianza DNS
      (device -> Pi-hole -> DNSCrypt-Proxy -> upstream)
    - Siempre incluye las secciones de Goals y Non-Goals
    - Señalar si el cambio requiere ajustar reglas de firewall/DNAT o el FTLCONF_webserver_acl
    - Declarar el soporte IPv4 e IPv6 del cambio explícitamente — no asumir
      que cubrir IPv4 es suficiente
    - Si el cambio agrega una imagen/dependencia nueva, fijar versión
      explícita y mecanismo de verificación (firma/checksum); si no aplica,
      justificar por qué
    - Usa el MCP de Context7 para buscar documentación de referencia, configuraciones, código y otros
  specs:
    - "Usar el formato nativo de OpenSpec — header de nivel 4 \"#### Scenario: <nombre>\" con bullets \"**WHEN**\" / \"**THEN**\" / \"**AND**\""
    - Cada Requirement debe incluir la palabra SHALL o MUST (lo exige el validador)
  design:
    - Incluir diagramas de secuencia para flujos complejos (ej. resolución
      DNS con cache miss, fallo de un resolver upstream)
  tasks:
    - Incluir verificación dual-stack — dig A y AAAA contra Pi-hole,
      confirmando resolución y DNSSEC (ad flag) en ambas familias
    - No asumir una subnet de LAN específica (ej. 192.168.1.0/24) sin
      confirmarla primero con el usuario
