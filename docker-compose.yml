services:
  dnscrypt-proxy:
    build:
      context: ./dnscrypt-proxy
      args:
        DNSCRYPT_VERSION: "2.1.18"
        CPU_ARCH: "arm64"    # cambiar a "arm" si tu Pi OS es de 32 bits
    container_name: dnscrypt-proxy
    restart: unless-stopped
    volumes:
      - './dnscrypt-proxy/dnscrypt-proxy.toml:/config/dnscrypt-proxy.toml:ro'
    networks:
      pihole_net:
        ipv4_address: 172.20.0.2
    # Resolución DNS real (no solo puerto abierto) contra el propio
    # dnscrypt-proxy. start_period en 15s: un arranque en frío mide hasta
    # ~6s hasta tener un upstream validado (fetch de resolvers + prueba de
    # certificados) — con margen para no marcar "unhealthy" en un arranque
    # normal (ver openspec/changes/add-dnscrypt-proxy-healthcheck).
    healthcheck:
      test: ["CMD", "drill", "-p", "5053", "example.com", "@127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    depends_on:
      dnscrypt-proxy:
        condition: service_healthy
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: '${TZ}'
      FTLCONF_webserver_api_password: '${PIHOLE_PASSWORD}'
      FTLCONF_dns_upstreams: '172.20.0.2#5053'
      FTLCONF_dns_dnssec: 'true'
      # 'ALL' (no 'LOCAL'): en una red bridge de Docker con puertos DNS
      # publicados, 'LOCAL' rechaza en silencio consultas de clientes LAN
      # reales porque su subnet no coincide con ninguna interfaz propia del
      # contenedor (ver openspec/changes/harden-pihole-dns-only-production).
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_rateLimit_count: '1000'
      FTLCONF_dns_rateLimit_interval: '60'
      # La subnet vive en .env (LAN_SUBNET) — el guard :? hace fallar el
      # arranque con un mensaje claro si falta, en vez de producir una ACL
      # malformada en silencio (ver openspec/changes/
      # parametrize-env-vars-drop-dnsmasq-mount).
      FTLCONF_webserver_acl: '+${LAN_SUBNET:?LAN_SUBNET debe estar definido en .env},+127.0.0.1'
      FTLCONF_webserver_session_timeout: '1800'
      # NTP cliente/servidor apagados a propósito: este stack es solo DNS.
      FTLCONF_ntp_sync_active: 'false'
      FTLCONF_ntp_ipv4_active: 'false'
      FTLCONF_ntp_ipv6_active: 'false'
    volumes:
      - './etc-pihole:/etc/pihole'
    networks:
      pihole_net:
        ipv4_address: 172.20.0.3

networks:
  pihole_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
